<html>
<head>
	<meta charset="utf-8">
	<title>회원정보</title>
	<th:block th:replace="~{/module/link.html}"></th:block>
</head>
<body>
<div class="container py-4">
	<!-- 헤더 -->
	<th:block th:replace="~{/module/top.html}"></th:block>
	<!-- 본문 상단 -->
	<div class="p-5 mb-4 bg-success-subtle rounded-3">
		<div class="container-fluid py-5">
			<h1 class="display-5 fw-bold">회원정보</h1>
			<p class="col-md-8">BookMarket</p>
		</div>
	</div>
	<!-- 본문 내용 -->
	<div class="row align-items-md-stretch">
		<!-- 다국어 처리 -->
		<div class="text-end">
			<a href="?lang=ko" class="a-lang">KOREAN</a> |
			<a href="?lang=en" class="a-lang">ENGLISH</a>
		</div>
		<form th:object="${member}" th:action="@{/member/update}" method="post">
			<legend class="mb-4">회원정보</legend>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">회원 ID</label>
				<div class="col-sm-3">
					<input type="text" name="memberId" class="form-control" th:field="*{memberId}" readonly>
				</div>
				<div class="col-sm-4">
					<span class="s-id">회원 ID는 수정이 불가합니다.</span>
				</div>				
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{memberId}"></p>
				</div>
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">회원 이름</label>
				<div class="col-sm-3">
					<input type="text" name="name" class="form-control"  th:field="*{name}">
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{name}"></p>
				</div>				
			</div>
			<div class="mb-3 row">
				<div class="col-sm-2"></div>
				<div class="col-sm-10">
					<span class="s-a">비밀번호는 숫자, 영문자, 특수문자를 포함하여 8~16글자 사이로 입력하세요. </span>
				</div>
			</div>					
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">비밀번호</label>
				<div class="col-sm-3">
					<input type="password" name="password" class="form-control" >
				</div>
				<div class="col-sm-7">
					<p class="text-danger" th:errors="*{password}"></p>
				</div>				
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">비밀번호 확인</label>
				<div class="col-sm-3">
					<input type="password" name="password2" class="form-control" >
				</div>
				<div class="col-sm-7">
					<p class="text-danger" th:errors="*{password2}"></p>
				</div>			
			</div>			
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">전화번호</label>
				<div class="col-sm-3">
					<input type="text" name="phone" class="form-control" th:field="*{phone}">
				</div>
				<div class="col-sm-7">
					<p class="text-danger" th:errors="*{phone}"></p>
				</div>				
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">이메일</label>
				<div class="col-sm-3">
					<input type="text" name="email" class="form-control" th:field="*{email}">
				</div>
				<div class="col-sm-7">
					<p class="text-danger" th:errors="*{email}"></p>
				</div>				
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">성별</label>
				<div class="col-sm-3">
						<input type="radio" name="gender" id="g1" value="남성" th:checked="*{gender == '남성'}"> <label for="g1"> 남성</label>
						<input type="radio" name="gender" id="g2" value="여성" th:checked="*{gender == '여성'}" class="ms-3"> <label for="g2"> 여성</label>
					<div class="col-sm-4">
						<p class="text-danger" th:errors="*{gender}"></p>
					</div>						
				</div>
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">나이</label>
				<div class="col-sm-3">
					<input type="number" name="age" class="form-control" th:field="*{age}">
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{age}"></p>
				</div>				
			</div>
			<!-- 주소 부분 -->			
			<div class="mb-3 row" >
				<label class="col-sm-2 control-label">국가명</label>
				<div class="col-sm-3">
					<!--<input type="text" name="address.country" class="form-control" th:field="*{address.country}">-->
					<select name="address.country" class="form-control" th:field="*{address.country}">
						<option value="한국">한국</option>
						<option value="일본">일본</option>
						<option value="중국">중국</option>
						<option value="미국">미국</option>
						<option value="영국">영국</option>
						<option value="프랑스">프랑스</option>
					</select>
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{address.country}"></p>
				</div>					
			</div>					
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">우편번호</label>
				<div class="col-sm-3">
					<input type="text" name="address.zipcode" class="form-control" id="zipcode" th:field="*{address.zipcode}" readonly>					
				</div>
				<div class="col-sm-2">
					<a th:href="|javascript:searchAddress()|" class="btn btn-success" role="button">주소검색</a>
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{address.zipcode}"></p>
				</div>					
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">기본주소</label>
				<div class="col-sm-5">
					<input type="text" name="address.basicAddress" class="form-control" id="basicAddress" th:field="*{address.basicAddress}" readonly>
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{address.basicAddress}"></p>
				</div>					
			</div>
			<div class="mb-3 row">
				<label class="col-sm-2 control-label">상세주소</label>
				<div class="col-sm-5">
					<input type="text" name="address.detailAddress" class="form-control" th:field="*{address.detailAddress}">
				</div>
				<div class="col-sm-4">
					<p class="text-danger" th:errors="*{address.detailAddress}"></p>
				</div>					
			</div>			

			<div class="mb-3 row">
				<div class="col-sm-10 col-sm-offset-2">
					<input type="submit" class="btn btn-primary" value="회원수정">
					<a th:href="|javascript:deleteMember('*{memberId}')|" class="btn btn-danger ms-2">회원탈퇴</a>
					<a th:href="@{/books}" class="btn btn-secondary ms-2"> 돌아가기</a>
				</div>
			</div>
		</form>
	</div>
	<!-- 푸터 -->
	<th:block th:replace="~{/module/bottom.html}"></th:block>
</div>
</body>
</html>
